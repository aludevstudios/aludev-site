<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AluDev | Under Maintenance</title>
    <style>
        :root {
            --primary-blue: #1a3a5f; /* Matches the dark blue in your logo */
            --accent-orange: #f39237; /* Matches the circuit orange in your logo */
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 500px;
        }

        .logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 1px;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
            /* Changed from uppercase to none to support "AluDev" casing */
            text-transform: none; 
            font-weight: 700;
        }

        .status-msg {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .divider {
            height: 2px;
            width: 60px;
            background-color: var(--accent-orange);
            margin: 2rem auto;
        }

        .founder-section {
            margin-top: 2rem;
        }

        .founder-label {
            display: block;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 1rem;
        }

        .founder-link {
            display: inline-block;
            text-decoration: none;
            color: var(--primary-blue);
            font-weight: bold;
            border: 2px solid var(--primary-blue);
            padding: 12px 30px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .founder-link:hover {
            background-color: var(--primary-blue);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" alt="AluDev Logo" class="logo">
        
        <h1>AluDev</h1>
        <p class="status-msg">Our digital home is currently under maintenance. <br>We’ll be back soon!</p>
        
        <div class="divider"></div>

        <div class="founder-section">
            <span class="founder-label">Founder</span>
            <a href="https://aludev.com" class="founder-link" target="_blank">View Founder's Profile</a>
        </div>

        <footer>
            &copy; 2026 AluDev. All rights reserved.
        </footer>
    </div>

</body>
</html>
